components:
  schemas:
    PatchApiV8ModuleRequest:
      type: object
      properties:
        data.type:
          type: string
          description: Module name (e.g., Accounts).
        data.id:
          type: string
          description: ID of the record to update.
        data.attributes:
          type: string
          description: Attributes to update (e.g., name).
      required:
      - data.type
      - data.id
      - data.attributes
    PostApiV8ModuleRequest:
      type: object
      properties:
        data.type:
          type: string
          description: Module name (e.g., Lead).
        data.attributes:
          type: string
          description: Attributes for the new record (e.g., last_name, status).
      required:
      - data.type
      - data.attributes
    PostApiV8ModuleAccountsIdRelationshipsContactsRequest:
      type: object
      properties:
        data.type:
          type: string
          description: Related module name (e.g., Contacts).
        data.id:
          type: string
          description: ID of the record to link.
      required:
      - data.type
      - data.id
    PostApiV8ModuleModulenameIdRelationshipsLinkfieldnameRequest:
      type: object
      properties:
        data.type:
          type: string
          description: Related module name (e.g., Contacts).
        data.id:
          type: string
          description: ID of the record to link.
      required:
      - data.type
      - data.id
    PostApiAccessTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          description: One of "client_credentials", "password", "authorization_code", or "refresh_token"
        client_id:
          type: string
          description: The client UUID
        client_secret:
          type: string
          description: The client secret
        username:
          type: string
          description: CRM username (required for password grant)
        password:
          type: string
          description: CRM password (required for password grant)
        code:
          type: string
          description: Authorization code (required for authorization_code grant)
        redirect_uri:
          type: string
          description: Redirect URI (required for authorization_code grant)
        refresh_token:
          type: string
          description: Refresh token (required for refresh_token grant)
      required:
      - grant_type
      - client_id
      - client_secret
    PostApiAccessTokenResponse:
      type: object
      properties:
        token_type:
          type: string
          description: Typically "Bearer"
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
    GetApiAuthorizeResponse:
      type: object
      properties:
        code:
          type: string
          description: Authorization code returned via redirect
tags:
