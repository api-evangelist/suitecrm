aid: suitecrm
name: SuiteCRM
image: https://suitecrm.com/wp-content/uploads/2018/01/favicon-144-1.png
description: 'SuiteCRM is the world’s #1 open source CRM, offering self‑hosted deployments for full data sovereignty and a hosted SaaS option
  with no licence fees. It provides a flexible data model, robust reporting, and extensive customization for sales, marketing, and support teams.
  The platform supports on‑premise installations as well as SuiteCRM Hosted, delivering enterprise‑grade features without vendor lock‑in.'
